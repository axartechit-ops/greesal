version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: greesal-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=${MONGODB_URI:-mongodb://localhost:27017}
      - DATABASE_NAME=greesal
      - PORT=8000
      - FRONTEND_URL=http://localhost:3000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
    env_file:
      - .env.local

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greesal-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-greesal_auth_super_secret_session_key_2026}
      - MONGODB_URI=${MONGODB_URI:-mongodb://localhost:27017/greesal}
      - BACKEND_URL=http://backend:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    depends_on:
      - backend
    env_file:
      - .env.local
